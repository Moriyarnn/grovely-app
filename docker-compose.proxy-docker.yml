# Override for use with a reverse proxy running in Docker (Traefik, Nginx
# Proxy Manager, dockerized Caddy, etc.). For a reverse proxy installed
# directly on the host OS (Caddy, Nginx, Apache, HAProxy), use
# docker-compose.proxy-host.yml instead.
#
# What this does:
#  - Builds the frontend without a hardcoded backend port so API calls go to
#    the same origin (e.g. https://grovely.example.com/api) instead of :3000.
#  - Removes the backend's published host port — the reverse proxy reaches it
#    over the shared Docker network only.
#  - Attaches frontend + backend to an external Docker network ("proxy" by
#    default) so your reverse proxy container can resolve them by name.
#
# Setup:
#   1. Create the shared network once on the host:
#        docker network create proxy
#   2. Attach your reverse proxy container to the same network.
#   3. Point it at:
#        frontend → grovely-prod-frontend:5173
#        backend  → grovely-prod-backend:3000
#   4. Start Grovely:
#        docker compose -f docker-compose.yml -f docker-compose.proxy-docker.yml up -d
#
# This pulls the `:latest-proxy` frontend image (built with VITE_BACKEND_PORT="")
# so API calls go to the same origin. No `--build` needed.
#
# Override the network name via PROXY_NETWORK in your root .env if you already
# have a different shared network (e.g. "web", "traefik", "caddy_net").

services:
  frontend:
    image: ghcr.io/grovely-org/grovely-frontend:${GROVELY_VERSION:-latest}-proxy
    # If you'd rather build locally, comment the `image:` line above and use
    # `docker compose ... up -d --build`. The main compose file provides the
    # build context; this overlay overrides the build arg below.
    build:
      args:
        VITE_BACKEND_PORT: ""
    ports: !reset []
    networks:
      - app_net
      - proxy

  backend:
    ports: !reset []
    networks:
      - app_net
      - proxy

  updater:
    environment:
      - GROVELY_COMPOSE_FILES=docker-compose.yml,docker-compose.proxy-docker.yml

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
