name: grovely-uat

services:
  frontend:
    container_name: grovely-uat-frontend
    build:
      context: ./grovely-frontend
      target: build
      args:
        BUILD_MODE: uat
        VITE_BACKEND_PORT: "3002"
    ports: !override
      - "5175:5173"
    depends_on:
      - backend
    networks:
      - app_net
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'
    restart: always

  backend:
    container_name: grovely-uat-backend
    build: ./grovely-backend
    ports: !override
      - "3002:3000"
    volumes:
      - sqlite_data_uat:/app/data
      - updater_state_uat:/updater-state:ro
    environment:
      - NODE_ENV=staging
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - UPDATER_TOKEN_FILE=/updater-state/updater-token
    env_file:
      - .env.uat
    networks:
      - app_net
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    restart: always

  # UAT uses the prerelease feed so release-candidate image updates can be
  # verified without exposing them to stable installations.
  updater:
    container_name: grovely-uat-updater
    build: ./grovely-updater
    volumes:
      - ./:/grovely
      - /var/run/docker.sock:/var/run/docker.sock
      - updater_state_uat:/state
    environment:
      - PORT=3003
      - GROVELY_APP_DIR=/grovely
      - GROVELY_COMPOSE_FILES=docker-compose.yml,docker-compose.uat.yml
      - GROVELY_ENV_FILE=.env.uat
      - GROVELY_COMPOSE_ENV_FILE=.env.uat
      - BACKEND_INTERNAL_URL=http://backend:3000
      - UPDATER_TOKEN_FILE=/state/updater-token
      - UPDATE_PULL_ENABLED=true
      - UPDATE_BUILD_ON_INSTALL=false
      - UPDATE_FEED_URL=https://grovely.org/releases/uat.json
      - UPDATE_CHECK_INTERVAL_HOURS=${UPDATE_CHECK_INTERVAL_HOURS:-24}
    depends_on:
      - backend
    networks:
      - app_net
    restart: always

networks:
  app_net:
    driver: bridge

volumes:
  sqlite_data_uat:
  updater_state_uat:
