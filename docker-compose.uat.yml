name: grovely-uat

services:
  frontend:
    container_name: grovely-uat-frontend
    build:
      context: ./grovely-frontend
      target: build
      args:
        BUILD_MODE: uat
        VITE_BACKEND_PORT: "3002"
    ports:
      - "5175:5173"
    depends_on:
      - backend
    networks:
      - app_net
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'
    restart: always

  backend:
    container_name: grovely-uat-backend
    build: ./grovely-backend
    ports:
      - "3002:3000"
    volumes:
      - sqlite_data_uat:/app/data
    environment:
      - NODE_ENV=staging
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    env_file:
      - ./grovely-backend/.env.uat
    networks:
      - app_net
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    restart: always

networks:
  app_net:
    driver: bridge

volumes:
  sqlite_data_uat:
