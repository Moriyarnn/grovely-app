name: grovely-prod

services:
  frontend:
    container_name: grovely-prod-frontend
    build:
      context: ./grovely-frontend
      target: build
      args:
        BUILD_MODE: prod
        VITE_BACKEND_PORT: "3000"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app_net
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'
    restart: always

  backend:
    container_name: grovely-prod-backend
    build: ./grovely-backend
    ports:
      - "3000:3000"
    volumes:
      - sqlite_data_prod:/app/data
    environment:
      - NODE_ENV=production
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    env_file:
      - ./grovely-backend/.env
    networks:
      - app_net
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    restart: always

networks:
  app_net:
    driver: bridge

volumes:
  sqlite_data_prod:
