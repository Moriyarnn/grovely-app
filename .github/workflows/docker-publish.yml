name: Publish Docker images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./grovely-backend
            image: ghcr.io/${{ github.repository_owner }}/grovely-backend
            target: ''
            build_args: ''
            tag_suffix: ''
          - name: frontend
            context: ./grovely-frontend
            image: ghcr.io/${{ github.repository_owner }}/grovely-frontend
            target: build
            build_args: |
              BUILD_MODE=prod
              VITE_BACKEND_PORT=3000
            tag_suffix: ''
          - name: frontend-proxy
            context: ./grovely-frontend
            image: ghcr.io/${{ github.repository_owner }}/grovely-frontend
            target: build
            build_args: |
              BUILD_MODE=prod
              VITE_BACKEND_PORT=
            tag_suffix: '-proxy'
          - name: updater
            context: ./grovely-updater
            image: ghcr.io/${{ github.repository_owner }}/grovely-updater
            target: ''
            build_args: ''
            tag_suffix: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        id: img
        run: echo "name=$(echo '${{ matrix.image }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          flavor: |
            suffix=${{ matrix.tag_suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release-assets:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        run: |
          mkdir release
          # Stamp GROVELY_VERSION and output as .env (ready to use, no rename needed)
          sed "s/^GROVELY_VERSION=.*/GROVELY_VERSION=${{ steps.version.outputs.tag }}/" example.env > release/example.env
          cp docker-compose.yml release/docker-compose.yml
          cp docker-compose.proxy-host.yml release/docker-compose.proxy-host.yml
          cp docker-compose.proxy-docker.yml release/docker-compose.proxy-docker.yml
          cp Caddyfile.example release/Caddyfile.example
          cp validate-env.sh release/validate-env.sh

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release/docker-compose.yml
            release/docker-compose.proxy-host.yml
            release/docker-compose.proxy-docker.yml
            release/Caddyfile.example
            release/example.env
            release/validate-env.sh
