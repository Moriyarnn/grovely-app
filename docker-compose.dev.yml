name: grovely-dev

services:
  frontend:
    container_name: grovely-dev-frontend
    build:
      context: ./grovely-frontend
      target: dev
    ports:
      - "5174:5173"
    volumes:
      - ./grovely-frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_ENV=dev
      - VITE_BACKEND_PORT=3001
    depends_on:
      - backend
    networks:
      - app_net
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    restart: always

  backend:
    container_name: grovely-dev-backend
    build: ./grovely-backend
    ports:
      - "3001:3000"
    volumes:
      - ./grovely-backend:/app
      - /app/node_modules
      - sqlite_data_dev:/app/data
    environment:
      - NODE_ENV=development
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    env_file:
      - .env.dev
    networks:
      - app_net
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    restart: always

networks:
  app_net:
    driver: bridge

volumes:
  sqlite_data_dev:
