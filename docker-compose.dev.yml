name: grovely-dev

services:
  frontend:
    container_name: grovely-dev-frontend
    build:
      context: ./grovely-frontend
      target: dev
    ports:
      - "5174:5173"
    volumes:
      - ./grovely-frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_ENV=dev
      - VITE_BACKEND_PORT=3001
    depends_on:
      - backend
    networks:
      - app_net
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    restart: always

  backend:
    container_name: grovely-dev-backend
    build: ./grovely-backend
    entrypoint: ["sh", "/app/entrypoint.sh"]
    ports:
      - "3001:3000"
    volumes:
      - ./grovely-backend:/app
      - /app/node_modules
      - sqlite_data_dev:/app/data
    environment:
      - NODE_ENV=development
      - TZ=${TZ:-UTC}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    env_file:
      - .env.dev
    networks:
      - app_net
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    restart: always

  minio:
    container_name: grovely-dev-minio
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data_dev:/data
    networks:
      - app_net

  minio-init:
    container_name: grovely-dev-minio-init
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 3;
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/grovely-backups;
        exit 0;
      "
    networks:
      - app_net
    restart: "no"

  webdav:
    container_name: grovely-dev-webdav
    image: bytemark/webdav
    ports:
      - "8081:80"
    environment:
      AUTH_TYPE: Basic
      USERNAME: admin
      PASSWORD: admin
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  sqlite_data_dev:
  minio_data_dev:
